name: Actualizador Diario de Canales IPTV

on:
  schedule:
    # 17:10 UTC = 13:10 PM Chile Continental
    - cron: '10 17 * * *'
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install requests # Descomenta si usas requests

      - name: Ejecutar script de actualización
        run: python actualizar_canales_v8.py

      - name: Guardar cambios en GitHub
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/canales.json
          git diff-index --quiet HEAD || (git commit -m "bot: auto-actualización diaria de canales.json [skip ci]" && git push)
