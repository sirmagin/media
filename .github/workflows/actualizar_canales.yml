name: Actualizador Diario de Canales IPTV

on:
  # Se comenta el schedule para desactivar la ejecución automática diaria
  # schedule:
  #   - cron: '10 18 * * *'
  
  # Permite la ejecución manual desde la web, la app móvil o vía API
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip

      - name: Ejecutar script de actualización
        run: python actualizar_canales_v8.py

      - name: Guardar cambios en GitHub
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/canales.json
          if ! git diff-index --quiet HEAD; then
            git commit -m "bot: auto-actualización manual de canales.json [skip ci]"
            git pull --rebase origin main || git rebase --abort
            git push
          fi